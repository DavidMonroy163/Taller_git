<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Juegos Favoritos</title>
</head>
<body>
  <main id="destacados" class="main-content">
    <div class="wrapper">
      <div class="container">
        <input type="radio" name="slide" id="c1" checked>
        <label for="c1" class="card">
          <div class="row">
            <div class="icon">1</div>
            <div class="descripcion">
              <h3>MiSide</h3>
              <p>Imaginemos que tienes un juego en el que te preocupas por un personaje. <br> ¿Pero podrías imaginarte algún día entrando <br> tú mismo en ese juego?</p>
            </div>
          </div>
        </label>

        <input type="radio" name="slide" id="c2">
        <label for="c2" class="card">
          <div class="row">
            <div class="icon">2</div>
            <div class="descripcion">
              <h3>NEDDY GIRL OVERDOSE</h3>
              <p>NEEDY STREAMER OVERLOAD es un ADV de varios finales sobre la <br> vida de una chica (OMGkawaiiAngel) <br> con una fuerte necesidad de aprobación que aspira a <br> 
                convertirse en el ángel de internet más fuerte.</p>
            </div>
          </div>
        </label>

        <input type="radio" name="slide" id="c3">
        <label for="c3" class="card">
          <div class="row">
            <div class="icon">3</div>
            <div class="descripcion">
              <h3>Hollow Knight: Silksong</h3>
              <p>¡Descubre un vasto reino embrujado en Hollow Knight: Silksong! <br> Explora, lucha y sobrevive mientras asciendes a la cima de un vasto <br> reino gobernado por la seda y el canto.</p>
            </div>
          </div>
        </label>

        <input type="radio" name="slide" id="c4">
        <label for="c4" class="card">
          <div class="row">
            <div class="icon">4</div>
            <div class="descripcion">
              <h3>Halo: The Master Chief Collection</h3>
              <p>El emblemático viaje del Jefe Maestro incluye seis juegos creados <br> para PC y recopilados en una sola experiencia. <br> Ya seas un seguidor de toda la vida o descubras al Spartan 117 <br> por primera vez, esta colección te resultará la experiencia definitiva <br> de Halo.</p>
            </div>
          </div>
        </label>
      </div>
    </div>
  </main>
</body>
</html>
